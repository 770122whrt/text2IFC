function draw(){for(const view of views){const{canvas,gl,uniforms:u,meshes,position}=view;canvas.width=Math.round(canvas.clientWidth*devicePixelRatio);canvas.height=Math.round(canvas.clientHeight*devicePixelRatio);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.92,.95,.97,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.uniform3fv(u.center,state.center);gl.uniform2f(u.angles,state.yaw,state.tilt);gl.uniform2fv(u.pan,state.pan);gl.uniform1f(u.radius,state.radius);gl.uniform1f(u.aspect,canvas.width/canvas.height);gl.uniform2f(u.cut,state.floor?floorZ-.06:-1e8,state.floor?floorZ+2.5:1e8);for(const m of meshes){if(!state.walls&&m.class.startsWith('IfcWall'))continue;if(!state.slabs&&['IfcSlab','IfcRoof','IfcCovering'].includes(m.class))continue;const color=data.targets.includes(m.guid)?[.86,.25,.20]:data.refs.includes(m.guid)?[.12,.43,.76]:m.class==='IfcDoor'?[.47,.58,.63]:m.class==='IfcWindow'?[.48,.74,.76]:[.71,.76,.78];gl.uniform3fv(u.color,color);gl.bindBuffer(gl.ARRAY_BUFFER,m.buffer);gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,3,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,m.count)}}}
try{views=[setup('g',data.before),setup('d',data.after)];for(const{canvas}of views){let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);canvas.addEventListener('pointermove',e=>{if(!pointer)return;const dx=e.clientX-pointer[0],dy=e.clientY-pointer[1];pointer=[e.clientX,e.clientY];if(e.shiftKey){state.pan[0]+=2*dx/canvas.clientHeight;state.pan[1]-=2*dy/canvas.clientHeight}else{state.yaw+=dx*.008;state.tilt=Math.max(-1.5,Math.min(Math.PI/2,state.tilt+dy*.008))}draw()});canvas.addEventListener('wheel',e=>{e.preventDefault();state.radius=Math.max(.2,Math.min(5000,state.radius*Math.exp(e.deltaY*.001)));draw()},{passive:false})}focus(data.target);el('status').textContent='网格数量 G / D：'+data.audit.mesh_count.G+' / '+data.audit.mesh_count.D+'；网格生成失败：'+data.before.errors.length+' / '+data.after.errors.length+'；保留参照位置与网格：'+(data.audit.reference_geometry_unchanged?'全部一致':'请查看诊断');}catch(e){el('error').textContent=e.message}
el('focus').onchange=e=>focus(e.target.value);el('reset').onclick=()=>focus(data.target);el('top').onclick=()=>{state.yaw=0;state.tilt=Math.PI/2;draw()};el('iso').onclick=()=>{state.yaw=.5;state.tilt=.8;draw()};for(const n of ['floor','walls','slabs'])el(n).onchange=e=>{state[n]=e.target.checked;draw()};el('overview').onclick=()=>{const all=Object.values(data.before.meshes);state.center=[0,1,2].map(i=>(Math.min(...all.map(m=>m.bounds[i][0]))+Math.max(...all.map(m=>m.bounds[i][1])))/2);state.radius=Math.max(...[0,1].map(i=>Math.max(...all.map(m=>m.bounds[i][1]))-Math.min(...all.map(m=>m.bounds[i][0]))))*.6;state.pan=[0,0];draw()};window.addEventListener('resize',draw);
</script></html>
