[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text2ifc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.19,<5",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.117.1,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.22,<1",
  "ifcopenshell>=0.8.5,<0.9",
  "numpy>=1.26,<3",
  "lxml>=5,<6",
  "python-dotenv>=1,<2",
  "openai==2.43.0",
]
web-test = ["httpx>=0.28,<1", "pytest>=8,<10"]
knowledge-live = [
  "qdrant-client>=1.12,<2",
  "sentence-transformers>=3.3,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".deps/python312"]
addopts = "--import-mode=importlib"
cache_dir = ".tmp/pytest/cache"
