[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text2ifc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.19,<5",
]

[project.optional-dependencies]
knowledge-live = [
  "qdrant-client>=1.12,<2",
  "sentence-transformers>=3.3,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".deps/python312"]
addopts = "--basetemp=.pytest-tmp --import-mode=importlib"
