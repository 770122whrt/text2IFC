<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IFC 损坏前后对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#18303e;font:15px system-ui,sans-serif}header{padding:18px 24px;background:#fff;border-bottom:1px solid #d3dce2}h1{font-size:21px;margin:0 0 8px}p{margin:7px 0;line-height:1.5}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:#f8fafc}button,select{font:inherit;border:1px solid #bac9d1;border-radius:6px;background:white;padding:7px 11px;cursor:pointer}label{white-space:nowrap}.panels{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#b8c8d1}.panel{position:relative;background:#e9eff3}canvas{width:100%;height:62vh;display:block;touch-action:none}.caption{position:absolute;top:14px;left:18px;background:#fffffff0;padding:8px 13px;border-radius:6px;pointer-events:none;font-weight:600}footer{padding:14px 24px;background:white}.red{color:#bf4036}.blue{color:#1b70c1}details{margin-top:8px}pre{white-space:pre-wrap;font-size:12px;max-height:240px;overflow:auto}#status{font-size:13px;color:#506674}#error{color:#a12c25}
</style>
<header><h1 id="title"></h1><p>实际 IFC 三角网格 · 同一世界坐标与同步视角 · 仅供人工审阅，包含私有参考</p><p><span class="red">红色：被删除对象（只在 G 中）</span>　<span class="blue">蓝色：保留参照</span>　灰色：其他构件。开洞以墙的实际网格显示，洞口实体不画成实心。</p></header>
<div class="toolbar"><select id="focus" aria-label="定位对象"></select><button id="top">俯视</button><button id="iso">斜视</button><button id="overview">全楼范围</button><button id="reset">回到损坏处</button><label><input id="floor" type="checkbox" checked>目标层剖切</label><label><input id="walls" type="checkbox" checked>墙体</label><label><input id="slabs" type="checkbox">楼板／屋顶</label></div>
<div class="panels"><div class="panel"><div class="caption">G · 损坏前</div><canvas id="g" aria-label="损坏前 IFC 网格"></canvas></div><div class="panel"><div class="caption">D · 损坏后</div><canvas id="d" aria-label="损坏后 IFC 网格"></canvas></div></div>
<footer><p>拖动旋转，Shift＋拖动平移，滚轮缩放；两侧同步。目标层剖切只影响显示，不改变 IFC；此查看器不渲染原材质，也不作格式校验。</p><p id="selected"></p><p id="status"></p><p id="error"></p><details><summary>删除对象、参照位置核对与网格诊断</summary><pre id="audit"></pre></details></footer>
<script id="ifc-data" type="application/json">__IFC_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('ifc-data').textContent), el=id=>document.getElementById(id);
el('title').textContent=data.title;el('audit').textContent=JSON.stringify(data.audit,null,2);
const target=data.before.meshes[data.target], state={center:target.bounds.map(b=>(b[0]+b[1])/2),radius:3,yaw:0,tilt:Math.PI/2,pan:[0,0],floor:true,walls:true,slabs:false};
// The host bottom defines this display cut; it is shared by both panes.
const floorZ=data.floor_z;
function label(m){return m.class+(m.tag?' · Tag '+m.tag:'')}
for(const guid of [...data.targets,...data.refs]){const m=data.before.meshes[guid];if(!m)continue;const o=document.createElement('option');o.value=guid;o.textContent=(data.targets.includes(guid)?'删除：':'参照：')+label(m);el('focus').appendChild(o)}
function focus(guid){const m=data.before.meshes[guid];state.center=m.bounds.map(b=>(b[0]+b[1])/2);state.radius=3;state.pan=[0,0];el('focus').value=guid;el('selected').textContent=label(m)+'；世界包围盒中心 (m)：'+state.center.map(v=>v.toFixed(4)).join(', ')+(data.targets.includes(guid)?'；D 中已删除。':'；'+(data.audit.references.find(r=>r.guid===guid)?.unchanged?'G/D 位置及网格完全一致。':'G/D 不一致或网格不可用。'));draw()}
const vertex=`attribute vec3 position;uniform vec3 center;uniform vec2 angles;uniform vec2 pan;uniform float radius;uniform float aspect;varying float worldZ;void main(){vec3 p=position-center;float c=cos(angles.x),s=sin(angles.x);float x=p.x*c-p.y*s,y=p.x*s+p.y*c;float t=sin(angles.y),u=cos(angles.y);gl_Position=vec4((x/radius+pan.x)/aspect,(y*t+p.z*u)/radius+pan.y,(y*u-p.z*t)/10000.0,1.0);worldZ=position.z;}`;
const fragment=`precision mediump float;uniform vec3 color;uniform vec2 cut;varying float worldZ;void main(){if(worldZ<cut.x||worldZ>cut.y)discard;gl_FragColor=vec4(color,1.0);}`;
function setup(id,model){const canvas=el(id),gl=canvas.getContext('webgl',{antialias:true});if(!gl)throw Error('浏览器无法启用 WebGL，请在支持 WebGL 的浏览器打开。');function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const uniforms={};for(const n of ['center','angles','pan','radius','aspect','color','cut'])uniforms[n]=gl.getUniformLocation(program,n);const meshes=[];for(const m of Object.values(model.meshes)){if(m.class==='IfcOpeningElement')continue;const v=new Float32Array(m.faces.length*3);m.faces.forEach((idx,i)=>{v[i*3]=m.vertices[idx*3];v[i*3+1]=m.vertices[idx*3+1];v[i*3+2]=m.vertices[idx*3+2]});const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,v,gl.STATIC_DRAW);meshes.push({...m,buffer,count:m.faces.length})}return{canvas,gl,program,uniforms,meshes,position:gl.getAttribLocation(program,'position')}}
let views=[];
function draw(){for(const view of views){const{canvas,gl,uniforms:u,meshes,position}=view;canvas.width=Math.round(canvas.clientWidth*devicePixelRatio);canvas.height=Math.round(canvas.clientHeight*devicePixelRatio);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.92,.95,.97,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.uniform3fv(u.center,state.center);gl.uniform2f(u.angles,state.yaw,state.tilt);gl.uniform2fv(u.pan,state.pan);gl.uniform1f(u.radius,state.radius);gl.uniform1f(u.aspect,canvas.width/canvas.height);gl.uniform2f(u.cut,state.floor?floorZ-.06:-1e8,state.floor?floorZ+2.5:1e8);for(const m of meshes){if(!state.walls&&m.class.startsWith('IfcWall'))continue;if(!state.slabs&&['IfcSlab','IfcRoof','IfcCovering'].includes(m.class))continue;const color=data.targets.includes(m.guid)?[.86,.25,.20]:data.refs.includes(m.guid)?[.12,.43,.76]:m.class==='IfcDoor'?[.47,.58,.63]:m.class==='IfcWindow'?[.48,.74,.76]:[.71,.76,.78];gl.uniform3fv(u.color,color);gl.bindBuffer(gl.ARRAY_BUFFER,m.buffer);gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,3,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,m.count)}}}
try{views=[setup('g',data.before),setup('d',data.after)];for(const{canvas}of views){let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);canvas.addEventListener('pointermove',e=>{if(!pointer)return;const dx=e.clientX-pointer[0],dy=e.clientY-pointer[1];pointer=[e.clientX,e.clientY];if(e.shiftKey){state.pan[0]+=2*dx/canvas.clientHeight;state.pan[1]-=2*dy/canvas.clientHeight}else{state.yaw+=dx*.008;state.tilt=Math.max(-1.5,Math.min(Math.PI/2,state.tilt+dy*.008))}draw()});canvas.addEventListener('wheel',e=>{e.preventDefault();state.radius=Math.max(.2,Math.min(5000,state.radius*Math.exp(e.deltaY*.001)));draw()},{passive:false})}focus(data.target);el('status').textContent='网格数量 G / D：'+data.audit.mesh_count.G+' / '+data.audit.mesh_count.D+'；网格生成失败：'+data.before.errors.length+' / '+data.after.errors.length+'；保留参照位置与网格：'+(data.audit.reference_geometry_unchanged?'全部一致':'请查看诊断');}catch(e){el('error').textContent=e.message}
el('focus').onchange=e=>focus(e.target.value);el('reset').onclick=()=>focus(data.target);el('top').onclick=()=>{state.yaw=0;state.tilt=Math.PI/2;draw()};el('iso').onclick=()=>{state.yaw=.5;state.tilt=.8;draw()};for(const n of ['floor','walls','slabs'])el(n).onchange=e=>{state[n]=e.target.checked;draw()};el('overview').onclick=()=>{const all=Object.values(data.before.meshes);state.center=[0,1,2].map(i=>(Math.min(...all.map(m=>m.bounds[i][0]))+Math.max(...all.map(m=>m.bounds[i][1])))/2);state.radius=Math.max(...[0,1].map(i=>Math.max(...all.map(m=>m.bounds[i][1]))-Math.min(...all.map(m=>m.bounds[i][0]))))*.6;state.pan=[0,0];draw()};window.addEventListener('resize',draw);
</script></html>
